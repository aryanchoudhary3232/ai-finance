# Upstream Next.js application server
upstream nextjs_upstream {
    server web:3000;
    keepalive 64;
}

# HTTP Server - Reverse Proxy
server {
    listen 80;
    server_name localhost _;

    # Client upload limit (necessary for Gemini AI receipt scanning uploads)
    client_max_body_size 10M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Let's Encrypt ACME Challenge verification for Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Next.js Static Assets Caching
    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public static files caching
    location ~* ^/(favicon\.ico|logo.*\.png|banner\.jpeg)$ {
        proxy_pass http://nextjs_upstream;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Application & API Routes Reverse Proxy
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;

        # WebSocket & Streaming (Inngest / Next.js Server Actions)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for background jobs and LLM receipt processing
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

